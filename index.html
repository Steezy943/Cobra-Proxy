<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Browser Proxy Server</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: #fff; }
        .wrapper { display: flex; flex-direction: column; height: 95vh; max-width: 1200px; margin: 0 auto; }
        .nav-bar { display: flex; gap: 10px; background: #222; padding: 10px; border-radius: 6px; }
        input { flex: 1; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; border: none; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        iframe { flex: 1; border: 1px solid #444; background: #fff; margin-top: 15px; border-radius: 6px; }
        .info { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="nav-bar">
            <input type="text" id="urlInput" placeholder="Enter target site URL (e.g., https://example.com)" value="https://example.com">
            <button onclick="launchProxy()">Browse</button>
        </div>
        <div id="status" class="info">Initializing browser proxy system...</div>
        
        <!-- The Sandbox frame where the proxy worker intercepts everything -->
        <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        // Register our proxy script as an active system service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('proxy-worker.js')
            .then(reg => {
                document.getElementById('status').innerText = "Proxy Engine Status: Active & Intercepting Network Request Layer.";
                console.log("Service worker registered successfully:", reg);
            })
            .catch(err => {
                document.getElementById('status').innerText = "Proxy Activation Failed: " + err.message;
            });
        } else {
            document.getElementById('status').innerText = "Your browser does not support Service Workers.";
        }

        function launchProxy() {
            let targetUrl = document.getElementById('urlInput').value;
            if (!targetUrl) return;

            // Enforce clean protocols
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            // Directing the iframe to the address automatically routes the request 
            // directly into the active 'fetch' listener inside proxy-worker.js
            const frame = document.getElementById('proxyFrame');
            frame.src = targetUrl;
            document.getElementById('status').innerText = `Routing traffic for: ${targetUrl}`;
        }

        // Allow pressing Enter key to run the proxy
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') launchProxy();
        });
    </script>
</body>
</html>
